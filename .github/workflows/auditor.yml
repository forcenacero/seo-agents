name: Auditor Agent

on:
  schedule:
    # Cada día a las 6:00 UTC (8:00 ES verano, 7:00 ES invierno)
    # Una hora después del Performance para no solaparse
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # El crawler tarda más, dejamos margen
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Auditor agent
        env:
          DB_API_URL: ${{ secrets.DB_API_URL }}
          DB_API_TOKEN: ${{ secrets.DB_API_TOKEN }}
        run: python agents/auditor.py