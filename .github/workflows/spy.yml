name: Spy Agent

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'ID del cliente (vacío = todos los que tengan competidores)'
        required: false
        type: string

jobs:
  run-spy:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # margen para pausa ~4 min entre clientes (free-tier Gemini)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Spy agent
        env:
          DB_API_URL: ${{ secrets.DB_API_URL }}
          DB_API_TOKEN: ${{ secrets.DB_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.client_id }}" ]; then
            python agents/spy.py "${{ github.event.inputs.client_id }}"
          else
            python agents/spy.py
          fi