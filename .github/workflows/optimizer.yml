name: Optimizer Agent

on:
  schedule:
    # Martes y viernes a las 11:00 UTC. Genera sugerencias (suggested_value) para las
    # tareas técnicas aprobadas. Limitado por OPTIMIZER_MAX_URLS para respetar el
    # tope diario de Gemini (comparte cuota con el Estratega diario).
    - cron: '0 11 * * 2,5'
  workflow_dispatch:
    inputs:
      client_id:
        description: 'ID del cliente (vacío = todos los activos)'
        required: false
        type: string

jobs:
  run-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Optimizer agent
        env:
          DB_API_URL: ${{ secrets.DB_API_URL }}
          DB_API_TOKEN: ${{ secrets.DB_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          OPTIMIZER_MAX_URLS: '15'
        run: |
          if [ -n "${{ github.event.inputs.client_id }}" ]; then
            python agents/optimizer.py "${{ github.event.inputs.client_id }}"
          else
            python agents/optimizer.py
          fi