name: Strategist Agent

on:
  schedule:
    # Diario a las 8:00 UTC: tras el reset del tope diario de Gemini (~07-08 UTC)
    # y tras Performance (5:00) y Auditor (6:00). Modo masivo: todos los clientes.
    - cron: '0 8 * * *'
  # También bajo demanda desde el dashboard o GitHub UI
  workflow_dispatch:
    inputs:
      client_id:
        description: 'ID del cliente a analizar (vacío para todos)'
        required: false
        type: string

jobs:
  run-strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # margen para pausa ~3 min entre clientes (free-tier Gemini)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Strategist agent
        env:
          DB_API_URL: ${{ secrets.DB_API_URL }}
          DB_API_TOKEN: ${{ secrets.DB_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.client_id }}" ]; then
            echo "Modo bajo demanda: cliente ID ${{ github.event.inputs.client_id }}"
            python agents/strategist.py "${{ github.event.inputs.client_id }}"
          else
            echo "Modo masivo: todos los clientes activos"
            python agents/strategist.py
          fi